<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>HUMANIST</title>
  <meta name="description" content="You discovered the world. Now, discover yourself.">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: 100%;
      padding: 48px 28px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.75rem, 13vw, 11rem);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: 0.075em;
      white-space: nowrap;
    }

    p {
      margin: clamp(24px, 3vw, 40px) 0 0;
      font-size: clamp(1.05rem, 2vw, 1.6rem);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    @media (max-width: 620px) {
      main {
        padding: 36px 20px;
      }

      h1 {
        font-size: clamp(3.15rem, 15.5vw, 5.5rem);
        letter-spacing: 0.045em;
      }

      p {
        max-width: 22rem;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>HUMANIST</h1>
    <p>You discovered the world. Now, discover yourself.</p>
  </main>
</body>
</html>
