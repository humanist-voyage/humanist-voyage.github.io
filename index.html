<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>HUMANIST</title>
  <meta name="description" content="You discovered the world. Now, discover yourself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #faf9f5;
      color: #111111;
      font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    .learn-more {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      color: #111111;
      width: 26px;
      height: 26px;
      line-height: 1;
      text-decoration: none;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .learn-more svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .learn-more:hover {
      transform: scale(1.08);
      opacity: 0.65;
    }

    .learn-more:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
      border-radius: 2px;
    }

    main {
      width: 100%;
      padding: 48px 28px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.75rem, 13vw, 11rem);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: 0.075em;
      white-space: nowrap;
    }

    p {
      margin: clamp(24px, 3vw, 40px) 0 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(1.05rem, 2vw, 1.6rem);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    @media (max-width: 620px) {
      main {
        padding: 36px 20px;
      }

      h1 {
        font-size: clamp(3.15rem, 15.5vw, 5.5rem);
        letter-spacing: 0.045em;
      }

      p {
        max-width: 22rem;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>
  <a class="learn-more" href="mailto:info@humanist.voyage" title="Learn more" aria-label="Learn more">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 0 C54 31 69 46 100 50 C69 54 54 69 50 100 C46 69 31 54 0 50 C31 46 46 31 50 0Z"/>
    </svg>
  </a>
  <main>
    <h1>HUMANIST</h1>
    <p>You discovered the world. Now, discover yourself.</p>
  </main>
</body>
</html>
